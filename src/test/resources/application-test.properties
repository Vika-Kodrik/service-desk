# Профиль «test»: подключается ПОВЕРХ основного application.properties,
# поэтому здесь только отличия от боевой конфигурации.
#
# БД — H2 в памяти вместо файловой; data.sql по-прежнему выполняется
# (spring.sql.init.mode=always из основной конфигурации), так что тесты
# опираются на предсказуемые данные (admin/admin, заявки ivanov и petrov).

spring.datasource.url=jdbc:h2:mem:servicedesk-test;DB_CLOSE_DELAY=-1

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2-console.enabled=false
spring.thymeleaf.cache=true

logging.level.ru.kodrik.servicedesk=INFO
