<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments :: head('Заявка')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments :: navbar}"></nav>

<!-- Форма ввода/редактирования заявки (форма 3) -->
<main class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 card-title mb-4"
                        th:text="${requestForm.id == null} ? 'Новая заявка' : 'Редактирование заявки № ' + ${requestForm.id}">
                        Заявка
                    </h1>

                    <form th:action="@{/requests}" th:object="${requestForm}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="title" class="form-label">Тема <span class="text-danger">*</span></label>
                            <input type="text" id="title" th:field="*{title}" class="form-control"
                                   th:errorclass="is-invalid" required maxlength="200"
                                   placeholder="Краткое описание проблемы">
                            <div class="invalid-feedback" th:errors="*{title}">Ошибка</div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Описание <span class="text-danger">*</span></label>
                            <textarea id="description" th:field="*{description}" class="form-control"
                                      th:errorclass="is-invalid" rows="5" required maxlength="4000"
                                      placeholder="Что произошло, когда, как воспроизвести"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}">Ошибка</div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="categoryId" class="form-label">Категория <span class="text-danger">*</span></label>
                                <select id="categoryId" th:field="*{categoryId}" class="form-select"
                                        th:errorclass="is-invalid" required>
                                    <option value="" selected disabled>— выберите —</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}"
                                            th:text="${c.name} + ' (SLA: ' + ${c.slaHours} + ' ч)'">Категория</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{categoryId}">Ошибка</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="priority" class="form-label">Приоритет <span class="text-danger">*</span></label>
                                <select id="priority" th:field="*{priority}" class="form-select" required>
                                    <option th:each="p : ${T(ru.kodrik.servicedesk.entity.RequestPriority).values()}"
                                            th:value="${p.name()}" th:text="${p.label}">Приоритет</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="status" class="form-label">Статус <span class="text-danger">*</span></label>
                                <select id="status" th:field="*{status}" class="form-select" required>
                                    <option th:each="s : ${T(ru.kodrik.servicedesk.entity.RequestStatus).values()}"
                                            th:value="${s.name()}" th:text="${s.label}">Статус</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                            <a class="btn btn-outline-secondary" th:href="@{/requests}">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
