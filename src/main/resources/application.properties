
spring.application.name=service-desk

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/servicedesk;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Spring Boot Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

management.info.env.enabled=true

info.app.name=\u0423\u0447\u0451\u0442 \u0437\u0430\u044f\u0432\u043e\u043a \u0432 service desk
info.app.description=\u041a\u0443\u0440\u0441\u043e\u0432\u043e\u0439 \u043f\u0440\u043e\u0435\u043a\u0442: \u0432\u0435\u0431-\u043f\u0440\u0438\u043b\u043e\u0436\u0435\u043d\u0438\u0435 \u0443\u0447\u0451\u0442\u0430 \u0437\u0430\u044f\u0432\u043e\u043a \u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a\u043e\u0432 (Spring Boot 4, Spring Security, H2, Thymeleaf)
info.app.developer=\u041a\u043e\u0434\u0440\u0438\u043a \u0412.
info.app.version=1.0.0

logging.level.ru.kodrik.servicedesk=DEBUG
logging.level.org.springframework.security=INFO
